// ИТОГИ ГОЛОСОВАНИЯ

// RESULTS = GET || итоги голосования (учитываются только принятые заявки — MODERATION_ACCEPTED)
message GetResultsRequest {
  string competition = 1;       // идентификатор конкурса
  string category = 2;          // номинация; пусто = весь конкурс в пределах tour_point
  bool top3 = 3;                // true = по rate_top3 и только заявки top3=true
  repeated string jury_ids = 4; // белый список жюри; чужие голоса игнорируются
  string tour_point = 5;         // итоги в пределах точки тура (пусто = без учёта тура)
}
// ResultRow - итог голосования по одной заявке
message ResultRow {
  string contest_id = 1;                // ID заявки
  int32 total = 2;                      // сумма по уникальным жюри (последняя оценка каждого)
  int32 jury_count = 3;                 // сколько жюри оценило заявку
  map<string, int32> rates_by_jury = 4; // juryID -> оценка
}
message GetResultsResponse {
  repeated ResultRow rows = 1;             // сортировка: total desc, затем jury_count desc
  map<string, int32> jury_rated_count = 2; // juryID -> сколько заявок оценил
}

// ТУРЫ

// TOUR = OPEN || открыть тур голосования
message OpenTourRequest {
  string competition = 1;         // идентификатор конкурса
  repeated string categories = 2; // категории тура (пусто = все категории конкурса)
  string type = 3;                // тип тура: "main" | "top3"
  bool show_participants = 4;     // жюри видит данные участников или только номер/песню/видео
  ActionMeta meta = 5;            // метаданные действия для журнала аудита
  repeated string tour_points = 6; // точки тура (пусто = все точки); семантика как у categories
}
message OpenTourResponse {
  Tour tour = 1;
  string message = 2;
}
// TOUR = CLOSE || закрыть тур голосования
message CloseTourRequest {
  string tour_id = 1;  // ID закрываемого тура
  ActionMeta meta = 2; // метаданные действия для журнала аудита
}
message CloseTourResponse {
  Tour tour = 1;
  string message = 2;
}
// TOURS = LIST || список туров конкурса
message ListToursRequest {
  string competition = 1; // идентификатор конкурса
}
message ListToursResponse {
  repeated Tour tours = 1;
}
// TOUR = GET OPEN || получить открытый тур (или NotFound, если открытого нет)
message GetOpenTourRequest {
  string competition = 1; // идентификатор конкурса
  string category = 2;    // категория
  string type = 3;        // тип тура
}
message GetOpenTourResponse {
  Tour tour = 1;
  string message = 2;
}

// ЖУРНАЛ АУДИТА

// AUDIT = LIST || события журнала для админки
message ListAuditEventsRequest {
  string competition = 1; // идентификатор конкурса
  string action = 2;      // фильтр по действию (пусто - все)
  string actor_id = 3;    // фильтр по актору (пусто - все)
  int32 limit = 4;        // сколько событий за раз (например, 50)
  int32 offset = 5;       // с какой позиции (например, 0, 50, 100)
}
message ListAuditEventsResponse {
  repeated AuditEvent rows = 1;
  int32 total = 2; // всего событий по фильтру
}

// ==== СПРАВОЧНИК ТЕРРИТОРИЙ ====

message GeoEmpty {}

// Федеральный округ
message FederalDistrict {
  string code = 1;            // "ЦФО", "СЗФО", ... — стабильный id округа
  string name = 2;            // "Центральный федеральный округ"
  string center = 3;          // административный центр
  int32 regions_count = 4;    // сколько субъектов
}
message FederalDistrictsResponse {
  repeated FederalDistrict districts = 1;
}

// Субъект РФ
message Region {
  string id = 1;                // OBJECTGUID ФИАС — стабильный id субъекта
  string name = 2;              // "Тамбовская область"
  string code = 3;              // код субъекта в ГАР: "68"
  string federal_district = 4;  // "ЦФО"
}
message ListRegionsRequest {
  string federal_district = 1;  // пусто — все субъекты
}
message RegionsResponse {
  repeated Region regions = 1;
}

// Населённый пункт. id — OBJECTGUID ФИАС, для ближнего зарубежья "gn:<geonameid>".
message Settlement {
  string id = 1;
  string name = 2;               // "Умет"
  string type = 3;               // "г.", "с.", "д.", "рп."
  string region_id = 4;          // OBJECTGUID субъекта
  string region = 5;             // "Тамбовская область"
  string district = 6;           // "р-н Уметский" — различает тёзок
  string federal_district = 7;   // "ЦФО"
  string country = 8;            // "Россия" или страна ближнего зарубежья
}
message ListSettlementsRequest {
  string region_id = 1;   // OBJECTGUID субъекта или его код ("68")
  string query = 2;       // фильтр по началу названия
  int64 limit = 3;
  int64 offset = 4;
}
message SuggestRequest {
  string query = 1;
  int64 limit = 2;
  bool include_foreign = 3;  // добавлять города ближнего зарубежья
}
message SettlementsResponse {
  repeated Settlement settlements = 1;
  int64 total = 2;
}

// Страна справочника (без городов — их запрашивают отдельно, см. ListForeignSettlements)
message Country {
  string code = 1;   // "RU", "BY", "KZ", "AB", "DE", ...
  string name = 2;   // "Россия", "Беларусь", "Германия"
}
message CountriesResponse {
  repeated Country countries = 1;  // сначала Россия, затем бывший СССР и признанные РФ, затем весь мир по алфавиту
}

// Города страны (не Россия — для неё используется ListSettlements)
message ListForeignSettlementsRequest {
  string country_code = 1;  // "BY", "KZ", "AB", ...
  string query = 2;         // фильтр по началу названия
  int64 limit = 3;
  int64 offset = 4;
}

// ==== СПОРНЫЕ ЗАПИСИ МИГРАЦИИ ====

message GeoCandidate {
  string settlement_id = 1;
  string name = 2;
  string type = 3;
  string region = 4;
  string district = 5;
  string federal_district = 6;
  string country = 7;
}
// Запись, которую миграция не тронула: тёзки, опечатка, мусор, только регион.
message GeoIssue {
  string id = 1;
  string collection = 2;   // "person" | "artist"
  string doc_id = 3;
  string title = 4;        // ФИО или название артиста
  string raw_city = 5;
  string raw_region = 6;
  string raw_country = 7;
  string reason = 8;       // ambiguous | not_found | garbage | empty | region_only | foreign
  repeated GeoCandidate candidates = 9;
  bool resolved = 10;
}
message ListGeoIssuesRequest {
  string collection = 1;
  string reason = 2;
  bool include_resolved = 3;
  int64 limit = 4;
  int64 offset = 5;
}
message ListGeoIssuesResponse {
  repeated GeoIssue issues = 1;
  int64 total = 2;
}
message ResolveGeoIssueRequest {
  string collection = 1;
  string doc_id = 2;
  string settlement_id = 3;  // выбранный человеком НП
  string actor_id = 4;       // кто разобрал — для журнала аудита
}
message ResolveGeoIssueResponse {
  bool ok = 1;
  string message = 2;
}